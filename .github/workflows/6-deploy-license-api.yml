name: 6. Deploy License API

on:
  workflow_dispatch:
  push:
    paths:
      - "services/license-api/**"
      - "supabase-license/**"
      - ".github/workflows/6-deploy-license-api.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/license-api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
      - name: Deploy License API Worker
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Supabase URL
        if: ${{ secrets.SUPABASE_URL != '' }}
        run: printf '%s' "${{ secrets.SUPABASE_URL }}" | pnpm exec wrangler secret put SUPABASE_URL

      - name: Set Supabase service key
        if: ${{ secrets.SUPABASE_SERVICE_KEY != '' }}
        run: printf '%s' "${{ secrets.SUPABASE_SERVICE_KEY }}" | pnpm exec wrangler secret put SUPABASE_SERVICE_KEY

      - name: Set JWT secret
        if: ${{ secrets.JWT_SECRET != '' }}
        run: printf '%s' "${{ secrets.JWT_SECRET }}" | pnpm exec wrangler secret put JWT_SECRET

      - name: Set Telegram bot token
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
        run: printf '%s' "${{ secrets.TELEGRAM_BOT_TOKEN }}" | pnpm exec wrangler secret put TELEGRAM_BOT_TOKEN

      - name: Set Telegram webhook URL
        if: ${{ secrets.TELEGRAM_WEBHOOK_URL != '' }}
        run: printf '%s' "${{ secrets.TELEGRAM_WEBHOOK_URL }}" | pnpm exec wrangler secret put TELEGRAM_WEBHOOK_URL
